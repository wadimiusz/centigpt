[project]
name = "nanogpt"
version = "0.1.0"
description = "A small GPT-style transformer written from scratch: RoPE, SwiGLU, RMSNorm, tied embeddings, Lightning training loop"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vadim Fomin", email = "wadimiusz@gmail.com" }]
dependencies = [
    "datasets>=5.0.1",
    "lightning>=2.6.5",
    "loguru>=0.7.3",
    "numpy>=2.5.2",
    "tokenizers>=0.22.2",
    "torch>=2.13.0",
    "transformers>=5.15.1",
    "tyro>=1.0.16",
]

[project.scripts]
nanogpt-train = "nanogpt.train:main"
nanogpt-tokenize = "nanogpt.data.memmap:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanogpt"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

# ---------------------------------------------------------------------------
# ruff — линтер и форматтер. Запуск:
#   uv run ruff check .          # найти проблемы
#   uv run ruff check --fix .    # починить то, что чинится автоматически
#   uv run ruff format .         # переформатировать (сейчас намеренно не гоняем)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Сознательно выключенные правила.
ignore = [
    # C408 требует переписывать list()/dict()/tuple() в литералы [] / {} / ().
    # Это вопрос вкуса, а не корректности: вызов конструктора читается явнее.
    # Правило и так не автофиксится — ruff считает такую замену unsafe fix,
    # так что хук ничего не переписывал, только шумел.
    "C408",
]

# РЕШЕНО: пока живём на дефолтном наборе ruff, extend-select не задаём.
# Таблица ниже сохранена, чтобы вернуться к вопросу без повторных замеров.
#
# Дефолт ruff 0.16 — это НЕ "E,F". Это кураторский набор из 413 отдельных
# правил, надёрганных по одному из 38 семейств. Из pycodestyle E туда входят
# только E722 и E902, из W — только W605, из D — только D419. Поэтому "из
# коробки" уже ловятся I001, UP008, PLR0402, всё семейство B и много чего ещё,
# но НЕ длина строк и НЕ трейлинг-пробелы.
#
# ВАЖНО: `select` этот дефолт ЗАТИРАЕТ, а `extend-select` — дополняет.
# Проверено на этом репозитории: extend-select E501,W даёт 11 находок,
# select E501,W — только 8 (теряются UP008, PLR0402, I001).
# Поэтому ниже именно extend-select.
#
# Сколько находок даст каждое семейство ПРЯМО СЕЙЧАС (замерено):
#
#   "E"     4   длина строк (E501): 4 строки в model.py, худшая — 222 символа
#   "W"     4   трейлинг-пробелы, пробелы в пустой строке, нет \n в конце файла
#   "I"     1   несортированные импорты в test_model.py
#   "UP"    1   super(CausalMultiheadAttention, self) -> super()
#   "PL"    1   import torch.nn as nn -> from torch import nn
#   "B"     0   flake8-bugbear (мутабельные дефолты и т.п.) — уже в дефолте
#   "SIM"   0   упрощения — чисто
#   "RUF"   0   чисто
#   "ARG"   1   неиспользуемый аргумент функции
#   "N"    18   pep8-naming. ОСТОРОЖНО: почти всё это твои W_Q/W_K/W_V/W_O —
#               осмысленная матричная нотация, которую N815 считает ошибкой
#   "D"    52   докстринги в каждой публичной функции
#   "ANN"  77   обязательные аннотации типов везде, включая тесты
#
# extend-select = [...]

# ---------------------------------------------------------------------------
# mypy — проверка типов. Запуск:
#   uv run mypy .
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
mypy_path = "src"
exclude = '^\.venv/'

# Ключевая настройка. По умолчанию mypy НЕ заглядывает внутрь функций без
# аннотаций — а значит не проверяет и вызовы внутри них. Здесь это критично:
# конструкторы модулей в model.py не аннотированы.
check_untyped_defs = true

warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

# Нет ни py.typed, ни заглушек типов: не требуем их.
[[tool.mypy.overrides]]
module = ["datasets", "tqdm", "tqdm.*"]
ignore_missing_imports = true

# Строгость намеренно не выкручена: strict = true потребовал бы аннотировать
# все ~30 тестовых функций и утопил бы реальные находки в шуме.
